<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
#s05-root { position:absolute; inset:0; }
#s05-root .stage { position:absolute; inset:0; }
#s05-root .tag { position:absolute; left:0; right:0; top:200px; text-align:center; font-size:44px; color:var(--muted); }
#s05-root .ttl { position:absolute; left:0; right:0; top:330px; text-align:center; color:var(--muted); font-size:56px; }
#s05-root .row { position:absolute; left:110px; right:110px; }
#s05-root .row .lb { display:flex; justify-content:space-between; margin-bottom:22px; font-size:52px; }
#s05-root .row .bar { height:64px; border-radius:18px; background:var(--line); position:relative; overflow:hidden; }
#s05-root .row .bar i { position:absolute; left:0; top:0; bottom:0; border-radius:18px; }
#s05-root .r0 { top:500px; } #s05-root .r0 i { width:6px; background:var(--muted); }
#s05-root .r1 { top:720px; } #s05-root .r1 i { width:100%; background:var(--yellow); }
#s05-root .big { position:absolute; left:80px; right:80px; top:980px; text-align:center; font-size:112px; }
      </style>
      <div id="s05-root" data-composition-id="s05" data-width="1080" data-height="1920">
        <div class="stage">
<div class="tag mono">IN PERSPECTIVE · #1</div>
<div class="ttl">on the same scale</div>
<div class="row r0"><div class="lb"><span class="mono">1 million s</span><span class="muted">11 days</span></div><div class="bar"><i></i></div></div>
<div class="row r1"><div class="lb"><span class="mono">1 billion s</span><span class="y">32 years</span></div><div class="bar"><i></i></div></div>
<h1 class="hd big">a whole <span class="y">lifetime</span> bigger</h1>
        </div>
      </div>
      <script>
        (function () {
          var R = "#s05-root ";
          var $ = function (s) { return R + s; };
          var E = "power3.out", IO = "power2.inOut";
          var tl = gsap.timeline({ paused: true });
          function count(sel, from, to, t, d, fmt) {
            var el = document.querySelector(R + sel);
            var o = { v: from };
            var f = fmt || function (v) { return Math.round(v).toLocaleString("en-US"); };
            tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", onUpdate: function () { el.textContent = f(o.v); } }, t);
          }
          function draw(sel, t, d) {
            tl.fromTo($(sel), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.out" }, t);
          }
          tl.fromTo($(".stage"), { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.35, ease: E }, 0);
          var T = function (g) { return g - 12.7; };

tl.fromTo($(".ttl"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, T(12.8));
tl.fromTo($(".r0"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, T(13.0));
tl.fromTo($(".r1"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, T(13.15));
tl.fromTo($(".r1 i"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 1.2, ease: "power2.out" }, T(13.3));
tl.fromTo($(".big"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, T(15.3));

          tl.to($(".stage"), { opacity: 0, scale: 0.97, duration: 0.3, ease: "power2.in" }, 3.75);
          window.__timelines["s05"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
