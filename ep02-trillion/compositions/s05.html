<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
#s05-root { position:absolute; inset:0; }
#s05-root .stage { position:absolute; inset:0; }
#s05-root .tag { position:absolute; left:0; right:0; top:200px; text-align:center; font-size:44px; color:var(--muted); }
#s05-root .rate { position:absolute; left:0; right:0; top:420px; text-align:center; font-size:96px; color:var(--text); }
#s05-root .rate .u { color:var(--muted); font-size:64px; }
#s05-root .since { position:absolute; left:0; right:0; top:560px; text-align:center; font-size:60px; color:var(--muted); }
#s05-root .tot { position:absolute; left:0; right:0; top:760px; text-align:center; font-size:120px; color:var(--green); }
#s05-root .pb { position:absolute; left:120px; right:120px; top:960px; }
#s05-root .pb .row { display:flex; justify-content:space-between; font-size:48px; color:var(--muted); margin-bottom:20px; }
#s05-root .pb .bar { height:56px; border-radius:28px; background:var(--line); overflow:hidden; }
#s05-root .pb .bar i { display:block; width:74%; height:100%; border-radius:28px; background:var(--green); }
#s05-root .no { position:absolute; left:0; right:0; top:1140px; text-align:center; font-size:76px; font-weight:700; color:var(--yellow); letter-spacing:-0.03em; }
      </style>
      <div id="s05-root" data-composition-id="s05" data-width="1080" data-height="1920">
        <div class="stage">
<div class="tag mono">IN PERSPECTIVE · #2</div>
<div class="rate mono">$1,000,000<span class="u"> / day</span></div>
<div class="since">every day since year 1</div>
<div class="tot mono">$0</div>
<div class="pb"><div class="row"><span>spent</span><span class="mono">$1T</span></div><div class="bar"><i></i></div></div>
<div class="no">still not a trillion</div>
        </div>
      </div>
      <script>
        (function () {
          var R = "#s05-root ";
          var $ = function (s) { return R + s; };
          var E = "power3.out", IO = "power2.inOut";
          var tl = gsap.timeline({ paused: true });
          function count(sel, from, to, t, d, fmt) {
            var el = document.querySelector(R + sel);
            var o = { v: from };
            var f = fmt || function (v) { return Math.round(v).toLocaleString("en-US"); };
            tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", onUpdate: function () { el.textContent = f(o.v); } }, t);
          }
          function draw(sel, t, d) {
            tl.fromTo($(sel), { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: d || 0.5, ease: "power2.out" }, t);
          }
          tl.fromTo($(".stage"), { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.35, ease: E }, 0);
          var T = function (g) { return g - 17.2; };

tl.fromTo($(".rate"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, T(17.7));
tl.fromTo($(".since"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, T(20.1));
tl.fromTo([$(".tot"), $(".pb")], { opacity: 0 }, { opacity: 1, duration: 0.3 }, T(19.1));
count(".tot", 0, 740, T(19.2), 2.2, function (v) { return "$" + Math.round(v) + "B"; });
tl.fromTo($(".pb .bar i"), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 2.2, ease: "power2.out" }, T(19.2));
tl.fromTo($(".no"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: E }, T(21.3));

          tl.to($(".stage"), { opacity: 0, scale: 0.97, duration: 0.3, ease: "power2.in" }, 5.40);
          window.__timelines["s05"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
